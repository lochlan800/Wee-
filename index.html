<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow Tracker</title>
<meta name="description" content="Flow: a sleek daily tracker for hydration, bathroom breaks and dry nights.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- design tokens (dark first) ---------- */
:root{
  --bg:#080b16; --glow1:rgba(124,58,237,.35); --glow2:rgba(34,211,238,.22);
  --card:rgba(19,26,44,.82); --card-solid:#131a2c; --line:#2b3658; --chip:#1b2440; --cell:#182038;
  --ink:#eef2ff; --muted:#a8b3d4;
  --g1:#7c3aed; --g2:#2563eb; --on-g:#ffffff;
  --accent:#fbbf24; --accent-ink:#1a1200;
  --dry:#34d399; --dry-bg:#0f3b30; --dry-glow:0 0 14px rgba(52,211,153,.65);
  --nd:#a5b4fc; --nd-bg:#262d63;
  --sel:#f472b6; --flame:#ff8a3d;
  --c-drink:#22d3ee; --c-pee:#fbbf24;
  --bp-bg:#3d3210; --bp-ink:#fde68a; --bd-bg:#0c3a4a; --bd-ink:#a5f3fc;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme: dark;
}
:root[data-theme="light"]{
  --bg:#eef1fa; --glow1:rgba(124,58,237,.16); --glow2:rgba(34,211,238,.18);
  --card:rgba(255,255,255,.88); --card-solid:#ffffff; --line:#ccd5ea; --chip:#edf0f9; --cell:#e8ecf7;
  --ink:#0f172a; --muted:#475569;
  --g1:#6d28d9; --g2:#1d4ed8; --on-g:#ffffff;
  --accent:#f59e0b; --accent-ink:#1a1200;
  --dry:#047857; --dry-bg:#c9f5df; --dry-glow:0 0 12px rgba(16,185,129,.55);
  --nd:#4338ca; --nd-bg:#dfe4ff;
  --sel:#be185d; --flame:#e0620f;
  --c-drink:#0e7490; --c-pee:#b45309;
  --bp-bg:#fde9b0; --bp-ink:#6b3a05; --bd-bg:#c4f1fb; --bd-ink:#134e63;
  --shadow:0 10px 30px rgba(40,60,120,.14);
  color-scheme: light;
}
@media (prefers-color-scheme: light){
  :root[data-theme="auto"]{
    --bg:#eef1fa; --glow1:rgba(124,58,237,.16); --glow2:rgba(34,211,238,.18);
    --card:rgba(255,255,255,.88); --card-solid:#ffffff; --line:#ccd5ea; --chip:#edf0f9; --cell:#e8ecf7;
    --ink:#0f172a; --muted:#475569;
    --g1:#6d28d9; --g2:#1d4ed8; --on-g:#ffffff;
    --accent:#f59e0b; --accent-ink:#1a1200;
    --dry:#047857; --dry-bg:#c9f5df; --dry-glow:0 0 12px rgba(16,185,129,.55);
    --nd:#4338ca; --nd-bg:#dfe4ff;
    --sel:#be185d; --flame:#e0620f;
    --c-drink:#0e7490; --c-pee:#b45309;
    --bp-bg:#fde9b0; --bp-ink:#6b3a05; --bd-bg:#c4f1fb; --bd-ink:#134e63;
    --shadow:0 10px 30px rgba(40,60,120,.14);
    color-scheme: light;
  }
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:"Space Grotesk","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink); background:var(--bg); min-height:100vh; font-size:16px; line-height:1.4; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1;
  background:
    radial-gradient(60% 50% at 10% 0%, var(--glow1), transparent 70%),
    radial-gradient(50% 45% at 100% 100%, var(--glow2), transparent 70%);
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sel); outline-offset:2px; border-radius:10px}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px 40px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1{margin:0;font-size:clamp(1.5rem,6vw,2rem);letter-spacing:-.5px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1 .logo{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 0 16px var(--g1)}
h1 .sub{font-size:.9rem;font-weight:500;color:var(--muted);letter-spacing:0}
h2{margin:0 0 10px;font-size:1.1rem;letter-spacing:-.2px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
.tools{display:flex;gap:8px;flex-wrap:wrap}

.card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:22px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.card.glow{box-shadow:0 0 0 3px var(--g1),0 0 28px var(--g1),var(--shadow)}
.btn{border:0;border-radius:14px;padding:10px 18px;min-height:44px;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on-g);font-weight:600;transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.97)}
.btn.alt{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tool{padding:8px 14px;font-size:.95rem}
.tool[aria-pressed="true"]{border-color:var(--g1);box-shadow:inset 0 0 0 1px var(--g1)}

.notice{background:var(--chip);border:1px solid var(--accent);border-radius:16px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* ---------- hero ---------- */
.hero{display:grid;gap:14px;grid-template-columns:1fr}
.status-card{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring-wrap{width:124px;height:124px;position:relative}
.ring-wrap.ping::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--sel);animation:ping .9s ease-out}
.ring{width:100%;height:100%;display:block}
.ring .trk{fill:none;stroke:var(--chip);stroke-width:10}
.ring .trk.thin{stroke-width:7}
.ring .arc{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.3,1.2,.5,1)}
.ring .arc.thin{stroke-width:7}
.ring .s1{stop-color:var(--c-drink)} .ring .s2{stop-color:var(--g1)}
.ring .x1{stop-color:var(--accent)} .ring .x2{stop-color:var(--sel)}
.ring text{fill:var(--ink);text-anchor:middle;font-family:inherit}
.ring .lv-l{font-size:10px;fill:var(--muted);letter-spacing:2px;font-weight:600}
.ring .lv-n{font-size:30px;font-weight:700}
.say{display:grid;gap:10px;min-width:0}
.coach{font-size:1.2rem;font-weight:600;line-height:1.25;letter-spacing:-.2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:.85rem;font-weight:500}
.xp-top{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted);font-weight:500}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin-top:4px;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:var(--p,0%);background:linear-gradient(90deg,var(--accent),var(--sel));border-radius:99px;transition:width .8s ease}
.bar.blue i{background:linear-gradient(90deg,var(--c-drink),var(--g1))}

.streak-card .top{display:flex;gap:12px;align-items:center;justify-content:space-between}
.streak-big{display:flex;align-items:center;gap:10px}
.streak-big b{font-size:2.6rem;line-height:1;letter-spacing:-1px}
.flame{display:inline-block;font-size:2rem;animation:flick 1.4s ease-in-out infinite;transform-origin:50% 90%;filter:drop-shadow(0 0 8px var(--flame))}
.streak-big small,.best small{display:block;color:var(--muted);font-size:.85rem;line-height:1.2}
.best{text-align:right}
.best b{font-size:1.5rem}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.strip div{text-align:center;font-size:.72rem;color:var(--muted)}
.dot{display:block;width:22px;height:22px;margin:0 auto 3px;border-radius:50%;background:var(--cell);border:1px solid var(--line)}
.dot.dry{background:var(--dry);border-color:var(--dry);box-shadow:var(--dry-glow)}
.dot.nd{background:var(--nd);border-color:var(--nd)}
[data-discreet="1"] .dot.dry,[data-discreet="1"] .dot.nd{background:var(--muted);border-color:var(--muted);box-shadow:none}
.legend{font-size:.85rem;color:var(--muted);margin:8px 0 0}

/* ---------- day bar ---------- */
.daybar{position:sticky;top:6px;z-index:20;margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;border-color:var(--g1)}
.daybar h2{margin:0;font-size:1.05rem}
.daybar small{display:block;color:var(--muted);font-weight:400}

/* ---------- layout ---------- */
.main{display:grid;gap:14px;grid-template-columns:1fr;margin-top:14px}
.col{display:grid;gap:14px;align-content:start;min-width:0}
.col-cal{order:-1}
.below{margin-top:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label{font-weight:500}
input[type=time]{border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:8px 10px;min-height:44px;color:var(--ink)}
#nightCard{scroll-margin-top:96px}
#nightCard.prompt{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.dotk{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.dotk.pee{background:var(--c-pee)} .dotk.drink{background:var(--c-drink)}

.sizes{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.size{border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:6px 14px;min-height:44px;font-weight:500}
.size[aria-pressed="true"]{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on-g);border-color:transparent}
.list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.list li{display:flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:0 0 0 14px;font-weight:500;min-height:44px}
.list .x{border:0;background:transparent;border-radius:50%;width:44px;height:44px;line-height:1;font-weight:700;color:var(--muted)}
.list .x:hover{color:var(--sel)}
.list small{color:var(--muted)}
.list li.empty{background:none;border:0;padding:0;min-height:0;color:var(--muted);font-weight:400}
.water-top{display:flex;gap:14px;align-items:center}
.water-top .bar{margin-top:6px;width:100%}
.water-top > div{flex:1;min-width:0}
.night-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.night{border:1px solid var(--line);background:var(--chip);border-radius:16px;padding:12px 8px;font-weight:600;font-size:1.02rem;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px}
.night .em{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;background:var(--cell);border:1px solid var(--line)}
.night.dry .em{color:var(--dry)}
.night.nd .em{color:var(--nd)}
.night[aria-pressed="true"].dry{background:var(--dry-bg);border-color:var(--dry);box-shadow:var(--dry-glow)}
.night[aria-pressed="true"].nd{background:var(--nd-bg);border-color:var(--nd)}
[data-discreet="1"] .night[aria-pressed="true"]{background:var(--cell);border-color:var(--ink);box-shadow:none}
.clear{margin-top:8px}

/* ---------- heatmap calendar ---------- */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.calhead h2{margin:0;text-align:center;flex:1}
.nav{width:44px;padding:0;font-size:1.1rem}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:5px}
.dow{text-align:center;font-size:.75rem;color:var(--muted);font-weight:600}
.cell{min-width:0}
.day{width:100%;position:relative;border:1px solid var(--line);background:var(--cell);border-radius:10px;min-height:52px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden}
.day .n{font-weight:600;font-size:.85rem;line-height:1}
.day .ic{font-size:.8rem;line-height:1;min-height:.9em;font-weight:700}
.day .ct{display:flex;gap:2px;line-height:1;justify-content:center;flex-wrap:wrap;max-width:100%}
.b{border-radius:6px;padding:1px 4px;font-size:.62rem;font-weight:700;line-height:1.25;white-space:nowrap}
.b-pee{background:var(--bp-bg);color:var(--bp-ink)}
.b-drink{background:var(--bd-bg);color:var(--bd-ink)}
.day.dry{background:var(--dry-bg);border-color:var(--dry);box-shadow:var(--dry-glow)}
.day.dry .ic{color:var(--dry)}
.day.nd{background:var(--nd-bg);border-color:var(--nd)}
.day.nd .ic{color:var(--nd)}
[data-discreet="1"] .day.dry,[data-discreet="1"] .day.nd{background:var(--cell);border-color:var(--line);box-shadow:none}
[data-discreet="1"] .day.dry .ic,[data-discreet="1"] .day.nd .ic{color:var(--muted)}
.day.today .n{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 6px}
.day.sel{outline:3px solid var(--sel);outline-offset:1px;z-index:1}
.day:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.day.sel:focus-visible{outline-color:var(--ink)}
.day[disabled]{opacity:.35;cursor:default}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center}
.stat b{display:block;font-size:1.4rem;line-height:1.1}
.stat small{color:var(--muted);font-size:.78rem;line-height:1.2;display:block}

/* ---------- chart ---------- */
.charthead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.charthead h2{margin:0}
.seg{display:flex;gap:4px}
.seg .btn{padding:6px 14px}
.seg .btn[aria-pressed="false"]{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:9px;font-family:inherit}
.chart .val{fill:var(--ink);font-size:8px;font-family:inherit;text-anchor:middle}
.chart .bp{fill:var(--c-pee)} .chart .bd{fill:var(--c-drink)}
.chart .off{opacity:.3}
.keys{display:flex;gap:14px;font-size:.85rem;color:var(--muted);margin-top:4px}

/* ---------- achievements ---------- */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:var(--chip);border-radius:16px;padding:12px;border:1px solid var(--accent);display:grid;gap:2px}
.badge .em{font-size:1.8rem;line-height:1.2}
.badge b{font-size:.95rem}
.badge small{color:var(--muted);font-size:.8rem;line-height:1.25;display:block}
.badge.locked{border-color:var(--line);border-style:dashed}
.badge.locked .em{filter:grayscale(1);opacity:.55}
.badge.new{animation:pop .7s}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 18px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);max-width:calc(100vw - 24px)}
.toast .btn{background:var(--accent);color:var(--accent-ink);padding:6px 16px}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@keyframes flick{50%{transform:scale(1.12) rotate(-4deg)}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes ping{from{transform:scale(1);opacity:1}to{transform:scale(1.35);opacity:0}}

@media (min-width:860px){
  .hero{grid-template-columns:1.6fr 1fr}
  .main{grid-template-columns:1fr 1fr}
  .col-cal{order:0}
  .ring-wrap{width:150px;height:150px}
  .coach{font-size:1.4rem}
  .day{min-height:66px}
  .b{font-size:.7rem}
  #nightCard{scroll-margin-top:0}
}
@media (max-width:400px){
  .wrap{padding:10px 14px 30px}
  .card{padding:14px 12px}
  .status-card{gap:12px}
  .ring-wrap{width:100px;height:100px}
  .coach{font-size:1.05rem}
  .week{gap:3px}
  .day{min-height:50px}
  .b{padding:1px 3px;font-size:.6rem}
  .stat{padding:8px 3px}
  .stat small{font-size:.72rem}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="sr" id="live" role="status" aria-live="polite" aria-atomic="true"></div>
<div class="toast" id="toast" role="status" hidden>
  <span id="toastText"></span>
  <button class="btn" id="toastUndo" type="button" hidden>Undo</button>
</div>

<div class="wrap">
  <header class="top">
    <h1><span class="logo" aria-hidden="true"></span>Flow <span class="sub">daily tracker</span></h1>
    <div class="tools">
      <button class="btn ghost tool" id="discreetBtn" type="button" aria-pressed="false" aria-label="Discreet mode">Discreet</button>
      <button class="btn ghost tool" id="themeBtn" type="button"></button>
      <button class="btn ghost tool" id="soundBtn" type="button" aria-pressed="true" aria-label="Sound effects"></button>
    </div>
  </header>

  <div class="notice" id="notice" role="status" hidden>
    <span id="noticeText"></span>
    <button class="btn ghost" id="noticeClose" type="button">Got it</button>
  </div>

  <section class="hero" aria-label="Your progress">
    <div class="card status-card" id="heroCard">
      <div class="ring-wrap" id="ringWrap">
        <svg class="ring" id="ring" viewBox="0 0 120 120" role="img" aria-label="Progress rings">
          <defs>
            <linearGradient id="gW" x1="0" y1="0" x2="1" y2="1"><stop class="s1" offset="0"/><stop class="s2" offset="1"/></linearGradient>
            <linearGradient id="gX" x1="0" y1="0" x2="1" y2="1"><stop class="x1" offset="0"/><stop class="x2" offset="1"/></linearGradient>
          </defs>
          <circle class="trk" cx="60" cy="60" r="52"/>
          <circle class="arc" id="arcWater" cx="60" cy="60" r="52" transform="rotate(-90 60 60)" stroke="url(#gW)" stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
          <circle class="trk thin" cx="60" cy="60" r="40"/>
          <circle class="arc thin" id="arcXp" cx="60" cy="60" r="40" transform="rotate(-90 60 60)" stroke="url(#gX)" stroke-dasharray="251.3" stroke-dashoffset="251.3"/>
          <text class="lv-l" x="60" y="53">LVL</text>
          <text class="lv-n" id="lvN" x="60" y="80">1</text>
        </svg>
      </div>
      <div class="say">
        <div class="coach" id="coach"></div>
        <div class="chips" id="chips"></div>
        <div>
          <div class="xp-top"><span id="lvTitle"></span><span id="xpText"></span></div>
          <div class="bar" aria-hidden="true"><i id="xpBar"></i></div>
        </div>
      </div>
    </div>
    <div class="card streak-card">
      <div class="top">
        <div class="streak-big"><span class="flame" aria-hidden="true">🔥</span><div><b id="streak">0</b><small id="streakLabel">night streak</small></div></div>
        <div class="best"><b id="best">0</b><small>best streak</small></div>
      </div>
      <div class="strip" id="strip" role="img" aria-label="Night log for the last 7 days"></div>
      <p class="legend" id="streakNote"></p>
    </div>
  </section>

  <section class="card daybar" id="dayBar" aria-label="Day being edited">
    <h2 id="dayTitle"></h2>
    <button class="btn ghost" id="todayBtn" type="button" hidden>Jump to today</button>
  </section>

  <div class="main">
    <div class="col">
      <section class="card" id="nightCard" aria-labelledby="nightTitle">
        <h2 id="nightTitle">Last night: dry?</h2>
        <div class="night-btns">
          <button class="night dry" id="nDry" type="button" aria-pressed="false"></button>
          <button class="night nd" id="nWet" type="button" aria-pressed="false"></button>
        </div>
        <button class="btn ghost clear" id="nClear" type="button">Clear answer</button>
      </section>

      <section class="card" aria-labelledby="weeTitle">
        <h2 id="weeTitle"><span class="dotk pee" aria-hidden="true"></span>Bathroom</h2>
        <div class="row">
          <label for="weeTime">Time</label>
          <input type="time" id="weeTime">
          <button class="btn" id="weeAdd" type="button">Log pee</button>
        </div>
        <ul class="list" id="weeList"></ul>
      </section>

      <section class="card" aria-labelledby="drinkTitle">

<script>
(function () {
"use strict";

/* =========================================================
   Constants and small helpers
   ========================================================= */
var STORE_KEY = "weeTracker.v1";
var MUTE_KEY = "weeTracker.muted";
var THEME_KEY = "weeTracker.theme";
var DISCREET_KEY = "weeTracker.discreet";
var GOAL = 6;                 // cups per day
var EARLY_CUTOFF = "16:00";   // drinks before this count as "early"
var SIZES = [
  { id: "s", label: "Sip", weight: 0.5, text: "½" },
  { id: "m", label: "Cup", weight: 1, text: "1" },
  { id: "l", label: "Big", weight: 1.5, text: "1½" }
];
var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var LEVEL_TITLES = ["Rookie", "Regular", "Steady", "Locked In", "Pro", "Elite", "Legend"];
var XP = { pee: 5, drink: 5, night: 20, dry: 30, goal: 40, sticker: 100 };
var PEE_LINES = ["Logged.", "Got it.", "Noted. Staying on top of it.", "Logged. Nice."];
var KEY_RE = /^\d{4}-\d{2}-\d{2}$/;
var TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;

var reducedQuery = null;
try { reducedQuery = window.matchMedia("(prefers-reduced-motion: reduce)"); } catch (e) {}
function isReduced() { return !!(reducedQuery && reducedQuery.matches); }

function $(id) { return document.getElementById(id); }
function esc(s) {
  var map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  return String(s).replace(/[&<>"']/g, function (c) { return map[c]; });
}
function pad(n) { return (n < 10 ? "0" : "") + n; }
function keyOf(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function parseKey(k) {
  var p = k.split("-");
  return new Date(+p[0], +p[1] - 1, +p[2]);
}
function isValidKey(k) {
  return typeof k === "string" && KEY_RE.test(k) && keyOf(parseKey(k)) === k;
}
function addDays(k, n) {
  var d = parseKey(k);
  d.setDate(d.getDate() + n);
  return keyOf(d);
}
function todayKey() { return keyOf(new Date()); }
function nowTime() {
  var d = new Date();
  return pad(d.getHours()) + ":" + pad(d.getMinutes());
}
function dayDiff(a, b) { return Math.round((parseKey(b) - parseKey(a)) / 864e5); }
function monthOf(k) {
  var d = parseKey(k);
  return { y: d.getFullYear(), m: d.getMonth() };
}
function prettyTime(t) {
  var h = +t.slice(0, 2);
  var suffix = h >= 12 ? "pm" : "am";
  h = h % 12 || 12;
  return h + ":" + t.slice(3) + " " + suffix;
}
function longDate(k) {
  return parseKey(k).toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
}
function shortDate(k) {
  return parseKey(k).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
}
function fmt(n) { return n % 1 === 0 ? String(n) : n.toFixed(1); }
function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }
function sizeInfo(id) {
  for (var i = 0; i < SIZES.length; i++) { if (SIZES[i].id === id) return SIZES[i]; }
  return SIZES[1];
}
function cupsOf(drinks) {
  return drinks.reduce(function (sum, d) { return sum + sizeInfo(d.s).weight; }, 0);
}
function earlyCupsOf(drinks) {
  return cupsOf(drinks.filter(function (d) { return d.t < EARLY_CUTOFF; }));
}
function byTime(a, b) { return a.t < b.t ? -1 : a.t > b.t ? 1 : 0; }

/* =========================================================
   Storage (every access guarded; falls back to memory)
   ========================================================= */
function sanitize(raw) {
  var out = { days: {}, stickers: {} };
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return out;

  if (raw.days && typeof raw.days === "object") {
    Object.keys(raw.days).forEach(function (k) {
      var d = raw.days[k];
      if (!isValidKey(k) || !d || typeof d !== "object") return;
      var day = { wees: [], drinks: [], night: null };
      if (Array.isArray(d.wees)) {
        d.wees.forEach(function (t) {
          if (typeof t === "string" && TIME_RE.test(t)) day.wees.push(t);
        });
      }
      if (Array.isArray(d.drinks)) {
        d.drinks.forEach(function (x) {
          if (x && typeof x === "object" && typeof x.t === "string" && TIME_RE.test(x.t)) {
            day.drinks.push({ t: x.t, s: (x.s === "s" || x.s === "l") ? x.s : "m" });
          }
        });
      }
      if (d.night === "dry" || d.night === "wet") day.night = d.night;
      day.wees.sort();
      day.drinks.sort(byTime);
      out.days[k] = day;
    });
  }
  if (raw.stickers && typeof raw.stickers === "object") {
    Object.keys(raw.stickers).forEach(function (id) {
      if (isValidKey(raw.stickers[id])) out.stickers[id] = raw.stickers[id];
    });
  }
  return out;
}

var loadNotice = "";
function load(quiet) {
  var raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { return sanitize(null); }
  if (!raw) return sanitize(null);
  try {
    var parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) throw new Error("bad shape");
    return sanitize(parsed);
  } catch (err) {
    if (!quiet) {
      try {
        localStorage.setItem(STORE_KEY + ".backup-" + Date.now(), raw);
        loadNotice = "Your saved data couldn't be read, so we started fresh. A copy of the old data was kept as a backup.";
      } catch (e2) {
        loadNotice = "Your saved data couldn't be read, so we started fresh.";
      }
    }
    return sanitize(null);
  }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {}
}
var memory = { muted: false, theme: "dark", discreet: false };
function readFlag(key, fallback) {
  try {
    var v = localStorage.getItem(key);
    return v === null ? fallback : v;
  } catch (e) { return fallback; }
}
function writeFlag(key, value) {
  try { localStorage.setItem(key, value); } catch (e) {}
}
function loadTheme() {
  var t = readFlag(THEME_KEY, memory.theme);
  return (t === "light" || t === "auto") ? t : "dark";
}

/* =========================================================
   State
   ========================================================= */
var data = load(false);
var muted = readFlag(MUTE_KEY, "0") === "1";
var discreet = readFlag(DISCREET_KEY, "0") === "1";
var theme = loadTheme();
var today = todayKey();
var selected = today;
var view = monthOf(today);
var override = null;           // temporary coach message
var newStickers = {};          // ids to animate on next render
var calFocus = false;
var size = "m";
var chartMode = "week";
var shownLevel = 1;
var touched = { weeTime: false, drinkTime: false };
var tabTarget = null;

function getDay(k, create) {
  var d = data.days[k];
  if (!d && create) {
    d = data.days[k] = { wees: [], drinks: [], night: null };
  }
  return d || { wees: [], drinks: [], night: null };
}
function pruneDay(k) {
  var d = data.days[k];
  if (d && !d.wees.length && !d.drinks.length && !d.night) delete data.days[k];
}
function pastKeys() {
  return Object.keys(data.days).filter(function (k) { return k <= today; });
}

/* =========================================================
   Streaks, XP, levels and achievements
   ========================================================= */
function streaks() {
  var dry = pastKeys().filter(function (k) { return data.days[k].night === "dry"; }).sort();
  var best = 0, run = 0, prev = null;
  dry.forEach(function (k) {
    run = (prev && dayDiff(prev, k) === 1) ? run + 1 : 1;
    if (run > best) best = run;
    prev = k;
  });
  var cur = 0;
  var k = today;
  var todayNight = getDay(k).night;
  if (todayNight !== "wet") {
    if (todayNight !== "dry") k = addDays(k, -1);
    while (getDay(k).night === "dry") { cur++; k = addDays(k, -1); }
  }
  return { cur: cur, best: Math.max(best, cur), dryTotal: dry.length };
}

function overall() {
  var s = streaks();
  s.goalDays = 0;
  s.logged = 0;
  s.earlyDays = 0;
  pastKeys().forEach(function (k) {
    var d = data.days[k];
    if (cupsOf(d.drinks) >= GOAL) s.goalDays++;
    if (earlyCupsOf(d.drinks) >= 3) s.earlyDays++;
    if (d.wees.length || d.drinks.length || d.night) s.logged++;
  });
  return s;
}

/* XP is derived from the data, so it always matches what is logged. */
function xpTotal() {
  var xp = 0;
  pastKeys().forEach(function (k) {
    var d = data.days[k];
    xp += d.wees.length * XP.pee + d.drinks.length * XP.drink;
    if (d.night) xp += XP.night;
    if (d.night === "dry") xp += XP.dry;
    if (cupsOf(d.drinks) >= GOAL) xp += XP.goal;
  });
  xp += Object.keys(data.stickers).length * XP.sticker;
  return xp;
}
function levelInfo(xp) {
  var level = Math.floor(Math.sqrt(xp / 50)) + 1;
  var floor = 50 * (level - 1) * (level - 1);
  var next = 50 * level * level;
  return {
    level: level,
    title: LEVEL_TITLES[Math.min(level - 1, LEVEL_TITLES.length - 1)],
    xp: xp, floor: floor, next: next,
    pct: Math.max(0, Math.min(100, (xp - floor) / (next - floor) * 100))
  };
}

function dryWord(n) { return discreet ? "✓ nights" : "dry nights"; }
var BADGES = [
  { id: "first", em: "🌙", name: "Clean Slate", hint: function () { return "Log your first " + (discreet ? "✓ night" : "dry night"); }, max: 1, val: function (s) { return s.dryTotal; } },
  { id: "d3", em: "🔥", name: "On Fire", hint: function () { return "3 " + dryWord() + " in a row"; }, max: 3, val: function (s) { return s.best; } },
  { id: "d7", em: "🛡️", name: "Unbreakable", hint: function () { return "7 " + dryWord() + " in a row"; }, max: 7, val: function (s) { return s.best; } },
  { id: "d10", em: "🦉", name: "Night Owl", hint: function () { return "10 " + dryWord() + " in total"; }, max: 10, val: function (s) { return s.dryTotal; } },
  { id: "d14", em: "👑", name: "Legend Mode", hint: function () { return "14 " + dryWord() + " in a row"; }, max: 14, val: function (s) { return s.best; } },
  { id: "h1", em: "💧", name: "Hydro Homie", hint: function () { return "Hit your water goal"; }, max: 1, val: function (s) { return s.goalDays; } },
  { id: "h5", em: "🌊", name: "Tidal Wave", hint: function () { return "Hit your water goal on 5 days"; }, max: 5, val: function (s) { return s.goalDays; } },
  { id: "early", em: "🌅", name: "Early Bird", hint: function () { return "3+ cups before 4pm, on 3 days"; }, max: 3, val: function (s) { return s.earlyDays; } },
  { id: "log", em: "📈", name: "Consistent", hint: function () { return "Log activity on 7 days"; }, max: 7, val: function (s) { return s.logged; } }
];

/* Adds newly earned achievements (never removes). Returns the new ones. */
function awardStickers() {
  var s = overall(), won = [];
  BADGES.forEach(function (b) {
    if (!data.stickers[b.id] && b.val(s) >= b.max) {
      data.stickers[b.id] = today;
      won.push(b);
    }
  });
  return won;
}

/* =========================================================
   Sound (Web Audio, subtle UI tones)
   ========================================================= */
var actx = null;
function tone(freq, start, dur, type, vol) {
  if (!actx) return;
  var osc = actx.createOscillator();
  var gain = actx.createGain();
  var t = actx.currentTime + start;
  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(vol || 0.05, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain);
  gain.connect(actx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.05);
}
function sfx(kind) {
  if (muted) return;
  try {
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
    }
    if (actx.state === "suspended") actx.resume();
    if (kind === "click") { tone(900, 0, 0.05, "sine", 0.04); }
    else if (kind === "log") { tone(660, 0, 0.08, "sine", 0.05); tone(880, 0.06, 0.1, "sine", 0.05); }
    else if (kind === "soft") { tone(440, 0, 0.2, "sine", 0.04); }
    else if (kind === "remove") { tone(330, 0, 0.07, "sine", 0.04); }
    else if (kind === "unlock") { tone(784, 0, 0.12, "triangle", 0.05); tone(1175, 0.1, 0.2, "triangle", 0.05); }
    else if (kind === "level") {
      [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.08, 0.18, "triangle", 0.05); });
    }
  } catch (e) {}
}

/* =========================================================
   Effects: sparks (canvas), or a static glow if reduced motion
   ========================================================= */
var canvas = $("fx");
var ctx2d = null;
try { ctx2d = canvas.getContext("2d"); } catch (e) {}
var sparks = [];
var rafId = 0;
var lastFx = 0;

function sizeCanvas() {
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(window.innerWidth * dpr);
  canvas.height = Math.round(window.innerHeight * dpr);
  if (ctx2d) ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeCanvas();
window.addEventListener("resize", sizeCanvas);

function burst() {
  if (!ctx2d) return;
  var now = Date.now();
  if (now - lastFx < 3000) return;            // keep it occasional
  lastFx = now;
  var colours = ["#22d3ee", "#a78bfa", "#f472b6", "#fbbf24"];
  var x = window.innerWidth / 2;
  var y = window.innerHeight * 0.3;
  for (var i = 0; i < 40; i++) {
    var angle = Math.random() * Math.PI * 2;
    var speed = 3 + Math.random() * 6;
    sparks.push({
      x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2,
      colour: colours[i % colours.length], life: 35 + Math.random() * 30
    });
  }
  if (!rafId) rafId = requestAnimationFrame(stepSparks);
}
function stepSparks() {
  ctx2d.clearRect(0, 0, window.innerWidth, window.innerHeight);
  sparks = sparks.filter(function (p) { return p.life > 0; });
  ctx2d.lineWidth = 2.5;
  ctx2d.lineCap = "round";
  sparks.forEach(function (p) {
    p.vy += 0.12;
    p.vx *= 0.97;
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    ctx2d.globalAlpha = Math.min(1, p.life / 20);
    ctx2d.strokeStyle = p.colour;
    ctx2d.beginPath();
    ctx2d.moveTo(p.x, p.y);
    ctx2d.lineTo(p.x - p.vx * 2, p.y - p.vy * 2);
    ctx2d.stroke();
  });
  ctx2d.globalAlpha = 1;
  if (sparks.length) {
    rafId = requestAnimationFrame(stepSparks);
  } else {
    rafId = 0;
    ctx2d.clearRect(0, 0, window.innerWidth, window.innerHeight);
  }
}
var glowTimer = 0;
function glow() {
  var hero = $("heroCard");
  hero.classList.add("glow");
  clearTimeout(glowTimer);
  glowTimer = setTimeout(function () { hero.classList.remove("glow"); }, 1800);
}
function celebrate() {
  if (isReduced()) glow();
  else burst();
}
function pingRing() {
  var wrap = $("ringWrap");
  wrap.classList.remove("ping");
  if (isReduced()) { glow(); return; }
  void wrap.offsetWidth;
  wrap.classList.add("ping");
  setTimeout(function () { wrap.classList.remove("ping"); }, 1000);
}

/* =========================================================
   Coach messages
   ========================================================= */
function autoMessage() {
  var d = getDay(selected);
  var isToday = selected === today;
  var s = streaks();
  var cups = cupsOf(d.drinks);
  var hour = new Date().getHours();

  if (cups >= GOAL) return "Hydration on point 💧";
  if (d.night) {
    if (discreet) return "Night logged. Nice and consistent.";
    if (d.night === "dry") {
      return isToday && s.cur >= 2 ? s.cur + "-night streak 🔥 keep it going" : "Dry night logged. Solid.";
    }
    return "No stress, it happens. New night, fresh start.";
  }
  if (isToday) {
    return hour < 12 ? "Morning. Last night: dry?" : "Check in when you're ready: last night?";
  }
  if (cups >= GOAL / 2) return "Halfway to the water goal. Keep it rolling.";
  if (cups > 0) return "Good start. Keep the water coming.";
  return "Fill in this day to keep your stats accurate.";
}
function say(text) {
  override = text;
  $("live").textContent = text;
  renderCoach();
}

/* =========================================================
   Rendering
   ========================================================= */
function setArc(id, circumference, fraction) {
  var f = Math.max(0, Math.min(1, fraction));
  $(id).style.strokeDashoffset = String(circumference * (1 - f));
}

function renderCoach() {
  $("coach").textContent = override || autoMessage();
  var d = getDay(selected);
  var cups = cupsOf(d.drinks);
  var nightChip;
  if (discreet) nightChip = d.night ? "Night logged" : "Night not logged";
  else nightChip = d.night === "dry" ? "Dry night" : d.night === "wet" ? "Not dry" : "Night not logged";
  $("chips").innerHTML =
    '<span class="chip">' + plural(d.wees.length, "pee") + '</span>' +
    '<span class="chip">' + fmt(cups) + ' / ' + GOAL + ' cups</span>' +
    '<span class="chip">' + esc(nightChip) + '</span>';

  setArc("arcWater", 326.7, cups / GOAL);
  var info = levelInfo(xpTotal());
  setArc("arcXp", 251.3, info.pct / 100);
  $("lvN").textContent = info.level;
  $("lvTitle").textContent = "Lvl " + info.level + " · " + info.title;
  $("xpText").textContent = info.xp + " / " + info.next + " XP";
  $("xpBar").style.setProperty("--p", info.pct + "%");
  $("ring").setAttribute("aria-label", "Water " + fmt(cups) + " of " + GOAL + " cups. Level " + info.level + ", " + info.xp + " of " + info.next + " XP.");
  shownLevel = info.level;
}

function renderTop() {
  var s = streaks();
  $("streak").textContent = s.cur;
  $("best").textContent = s.best;
  $("streakLabel").textContent = discreet ? "streak" : "night streak";
  $("streakNote").textContent = s.cur > 0 ? "Keep it rolling." : "Your next streak starts with the next night.";

  var html = "";
  for (var i = 6; i >= 0; i--) {
    var k = addDays(today, -i);
    var night = getDay(k).night;
    var cls = night === "dry" ? "dot dry" : night === "wet" ? "dot nd" : "dot";
    var letter = parseKey(k).toLocaleDateString(undefined, { weekday: "narrow" });
    html += '<div><span class="' + cls + '"></span>' + esc(letter) + '</div>';
  }
  $("strip").innerHTML = html;
}

function renderDay() {
  var d = getDay(selected);
  var isToday = selected === today;

  $("dayTitle").innerHTML = (isToday ? "Editing: Today" : "Editing") + "<small>" + esc(longDate(selected)) + "</small>";
  $("todayBtn").hidden = isToday;

  var title;
  if (discreet) title = isToday ? "Night ✓ / ✗" : "Night ✓ / ✗ · " + shortDate(selected);
  else title = isToday ? "Last night: dry?" : "Night before " + shortDate(selected) + ": dry?";
  $("nightTitle").textContent = title;

  var dryBtn = $("nDry"), wetBtn = $("nWet");
  if (discreet) {
    dryBtn.innerHTML = '<span class="em" aria-hidden="true">✓</span>';
    wetBtn.innerHTML = '<span class="em" aria-hidden="true">✗</span>';
    dryBtn.setAttribute("aria-label", "Night ✓");
    wetBtn.setAttribute("aria-label", "Night ✗");
  } else {
    dryBtn.innerHTML = '<span class="em" aria-hidden="true">✓</span>Dry night';
    wetBtn.innerHTML = '<span class="em" aria-hidden="true">○</span>Not dry';
    dryBtn.removeAttribute("aria-label");
    wetBtn.removeAttribute("aria-label");
  }
  dryBtn.setAttribute("aria-pressed", String(d.night === "dry"));
  wetBtn.setAttribute("aria-pressed", String(d.night === "wet"));
  $("nClear").disabled = !d.night;
  $("nightCard").classList.toggle("prompt", isToday && !d.night);

  renderLists(d);

  var cups = cupsOf(d.drinks);
  $("fill").style.setProperty("--p", Math.min(100, cups / GOAL * 100) + "%");
  $("goalText").textContent = cups >= GOAL
    ? "Goal hit · " + fmt(cups) + " cups"
    : fmt(cups) + " of " + GOAL + " cups";
  var early = earlyCupsOf(d.drinks);
  $("earlyText").textContent = early > 0
    ? fmt(early) + " cup" + (early === 1 ? "" : "s") + " before 4pm. Good timing."
    : "Daytime drinks count extra.";
}

function renderLists(d) {
  $("weeList").innerHTML = d.wees.length

        return '<li><span>' + esc(prettyTime(t)) + '</span>' +
          '<button class="x" type="button" data-del-wee="' + i + '" aria-label="Remove pee at ' + esc(prettyTime(t)) + '">✕</button></li>';

  $("drinkList").innerHTML = d.drinks.length

        return '<li><span>' + esc(prettyTime(x.t)) + ' <small>' + esc(sz.label) + ' (' + sz.text + ')</small></span>' +
          '<button class="x" type="button" data-del-drink="' + i + '" aria-label="Remove ' + esc(sz.label) + ' drink at ' + esc(prettyTime(x.t)) + '">✕</button></li>';

    : '<li class="empty">Nothing logged yet.</li>';
}

function dayCellHtml(k) {
  var day = getDay(k);
  var future = k > today;
  var isSel = k === selected;
  var cls = "day" + (day.night === "dry" ? " dry" : day.night === "wet" ? " nd" : "") +
            (k === today ? " today" : "") + (isSel ? " sel" : "");
  var glyph = day.night === "dry" ? "✓" : day.night === "wet" ? (discreet ? "✗" : "○") : "";

  var nightText;
  if (discreet) nightText = day.night === "dry" ? "Night ✓. " : day.night === "wet" ? "Night ✗. " : "Night not logged. ";
  else nightText = day.night === "dry" ? "Dry night. " : day.night === "wet" ? "Not dry. " : "Night not logged. ";
  var label = longDate(k) + (k === today ? ", today" : "") + (future ? ", in the future" : "") + ". " +
    nightText + plural(day.wees.length, "pee") + ", " + plural(day.drinks.length, "drink") + "." + (isSel ? " Selected." : "");

  var counts = "";
  if (day.wees.length) counts += '<span class="b b-pee">' + Math.min(day.wees.length, 99) + '</span>';
  if (day.drinks.length) counts += '<span class="b b-drink">' + Math.min(day.drinks.length, 99) + '</span>';

  return '<div class="cell" role="gridcell" aria-selected="' + isSel + '">' +
    '<button type="button" class="' + cls + '" data-date="' + k + '" tabindex="' + (k === tabTarget ? 0 : -1) + '"' +
    (future ? " disabled" : "") + (k === today ? ' aria-current="date"' : "") +
    ' aria-label="' + esc(label) + '">' +
    '<span class="n">' + parseKey(k).getDate() + '</span><span class="ic" aria-hidden="true">' + glyph + '</span>' +
    '<span class="ct" aria-hidden="true">' + counts + '</span></button></div>';
}

function renderCal() {
  var y = view.y, m = view.m;
  var count = new Date(y, m + 1, 0).getDate();
  var offset = (new Date(y, m, 1).getDay() + 6) % 7;
  var prefix = y + "-" + pad(m + 1) + "-";
  var nowM = monthOf(today);

  $("calTitle").textContent = MONTHS[m] + " " + y;
  $("next").disabled = (y * 12 + m) >= (nowM.y * 12 + nowM.m);

  tabTarget = selected.slice(0, 7) === prefix.slice(0, 7) ? selected : prefix + "01";
  if (tabTarget > today) tabTarget = today;

  var names = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  var html = '<div class="week" role="row">' + names.map(function (n) {
    return '<div class="dow" role="columnheader">' + n + '</div>';
  }).join("") + '</div>';

  var cells = [];
  var i, d;
  for (i = 0; i < offset; i++) cells.push('<div class="cell" role="gridcell"></div>');

  var dryN = 0, peeSum = 0, drinkSum = 0, logged = 0;
  for (d = 1; d <= count; d++) {
    var k = prefix + pad(d);
    cells.push(dayCellHtml(k));
    if (k <= today) {
      var day = getDay(k);
      if (day.night === "dry") dryN++;
      if (day.wees.length || day.drinks.length) {
        logged++;
        peeSum += day.wees.length;
        drinkSum += day.drinks.length;
      }
    }
  }
  while (cells.length % 7) cells.push('<div class="cell" role="gridcell"></div>');
  for (i = 0; i < cells.length; i += 7) {
    html += '<div class="week" role="row">' + cells.slice(i, i + 7).join("") + '</div>';
  }
  $("cal").innerHTML = html;

  $("calLegend").textContent = discreet
    ? "✓ / ✗ = night check. Amber number = pee, cyan number = drinks. Arrow keys move between days."
    : "Glowing green = dry night, purple = not dry. Amber number = pee, cyan number = drinks. Arrow keys move between days.";

  function avg(total) { return logged ? String(Math.round(total / logged * 10) / 10) : "–"; }
  $("mstats").innerHTML =
    '<div class="stat"><b>' + dryN + '</b><small>' + (discreet ? "✓ nights" : "dry nights") + '</small></div>' +
    '<div class="stat"><b>' + avg(peeSum) + '</b><small>pees per logged day</small></div>' +
    '<div class="stat"><b>' + avg(drinkSum) + '</b><small>drinks per logged day</small></div>';

  if (calFocus) {
    calFocus = false;
    var btn = $("cal").querySelector('[data-date="' + selected + '"]');
    if (btn) btn.focus();
  }
}

/* Hand-drawn SVG grouped bar chart of pee and drink counts */
function renderChart() {
  var days = [], i, k;
  if (chartMode === "week") {
    for (i = 6; i >= 0; i--) days.push(addDays(today, -i));
  } else {
    var count = new Date(view.y, view.m + 1, 0).getDate();
    for (i = 1; i <= count; i++) days.push(view.y + "-" + pad(view.m + 1) + "-" + pad(i));
  }
  var series = days.map(function (key) {
    var d = getDay(key);
    var future = key > today;
    return { k: key, pee: future ? 0 : d.wees.length, drink: future ? 0 : d.drinks.length, future: future };
  });
  var max = 1, peeTotal = 0, drinkTotal = 0;
  series.forEach(function (s) {
    max = Math.max(max, s.pee, s.drink);
    peeTotal += s.pee;
    drinkTotal += s.drink;
  });
  if (max > 4) max = Math.ceil(max / 2) * 2;

  var W = 300, H = 150, left = 20, right = 4, top = 16, bottom = 20;
  var plotW = W - left - right, plotH = H - top - bottom;
  var group = plotW / series.length;
  var barW = Math.max(2, Math.min(14, group * 0.38));
  var weekly = chartMode === "week";
  var svg = '';

  [0, 0.5, 1].forEach(function (f) {
    var y = top + plotH * (1 - f);
    svg += '<line class="grid" x1="' + left + '" x2="' + (W - right) + '" y1="' + y + '" y2="' + y + '"/>';
    svg += '<text class="ax" x="' + (left - 4) + '" y="' + (y + 3) + '" text-anchor="end">' + fmt(max * f) + '</text>';
  });

  series.forEach(function (s, idx) {
    var cx = left + group * idx + group / 2;
    var hp = plotH * s.pee / max, hd = plotH * s.drink / max;
    var cls = s.future ? " off" : "";
    if (s.pee) svg += '<rect class="bp' + cls + '" x="' + (cx - barW - 0.5) + '" y="' + (top + plotH - hp) + '" width="' + barW + '" height="' + hp + '" rx="2"/>';
    if (s.drink) svg += '<rect class="bd' + cls + '" x="' + (cx + 0.5) + '" y="' + (top + plotH - hd) + '" width="' + barW + '" height="' + hd + '" rx="2"/>';
    if (weekly) {
      if (s.pee) svg += '<text class="val" x="' + (cx - barW / 2 - 0.5) + '" y="' + (top + plotH - hp - 2) + '">' + s.pee + '</text>';
      if (s.drink) svg += '<text class="val" x="' + (cx + barW / 2 + 0.5) + '" y="' + (top + plotH - hd - 2) + '">' + s.drink + '</text>';
    }
    var dnum = parseKey(s.k).getDate();
    var showLabel = weekly || dnum === 1 || dnum % 5 === 0;
    if (showLabel) {
      var lab = weekly ? parseKey(s.k).toLocaleDateString(undefined, { weekday: "short" }).slice(0, 3) : String(dnum);
      svg += '<text class="ax" x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(lab) + '</text>';
    }
  });

  var rangeLabel = weekly ? "last 7 days" : MONTHS[view.m] + " " + view.y;
  var summary = "Bar chart, " + rangeLabel + ". Total pees " + peeTotal + ", total drinks " + drinkTotal + ".";
  $("chart").innerHTML = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(summary) + '">' + svg + '</svg>';
  $("rWeek").setAttribute("aria-pressed", String(weekly));
  $("rMonth").setAttribute("aria-pressed", String(!weekly));
}

function renderShelf() {

      '<b>' + esc(b.name) + '</b>' + detail + '<span class="sr">' + (earned ? "Unlocked" : "Locked") + '</span></div>';

var toastTimer = 0;

  var undoBtn = $("toastUndo");
  undoBtn.hidden = !undoFn;
  undoBtn.onclick = function () {
    hideToast();

  };

}

/* =========================================================
   Actions
   ========================================================= */
/* Saves, awards achievements/levels and shows the best message.
   ev: {text, sound, big} */
function commit(ev) {
  var won = awardStickers();
  var levelBefore = shownLevel;
  save();
  newStickers = {};
  won.forEach(function (b) { newStickers[b.id] = true; });

  var info = levelInfo(xpTotal());
  var leveled = info.level > levelBefore;

  var parts = [];
  if (won.length) {
    parts.push("Achievement unlocked: " + won.map(function (b) { return b.em + " " + b.name; }).join(", ") + ".");
  }
  if (leveled) parts.push("Level up. You're now Lvl " + info.level + " · " + info.title + ".");
  if (ev.text) parts.push(ev.text);
  var text = parts.join(" ");

  override = text || null;
  renderAll();
  newStickers = {};
  if (text) $("live").textContent = text;

  if (won.length) sfx("unlock");
  else if (leveled) sfx("level");
  else if (ev.sound) sfx(ev.sound);

  if (leveled) pingRing();
  if (ev.big || won.length || leveled) celebrate();
}

function chosenTime(inputId) {
  var input = $(inputId);
  var value = touched[inputId] ? input.value : nowTime();
  return TIME_RE.test(value) ? value : nowTime();
}
function resetTime(inputId) {
  touched[inputId] = false;
  $(inputId).value = nowTime();
}

function addPee() {
  var d = getDay(selected, true);
  d.wees.push(chosenTime("weeTime"));
  d.wees.sort();
  resetTime("weeTime");
  commit({ text: pick(PEE_LINES) + " +" + XP.pee + " XP", sound: "log" });
}

function addDrink() {
  var time = chosenTime("drinkTime");
  var d = getDay(selected, true);
  var before = cupsOf(d.drinks);
  d.drinks.push({ t: time, s: size });
  d.drinks.sort(byTime);
  resetTime("drinkTime");

  var after = cupsOf(d.drinks);
  var ev = { sound: "log" };
  if (before < GOAL && after >= GOAL) {
    ev.text = "Hydration on point 💧 Goal hit. +" + XP.goal + " XP";
    ev.big = true;
  } else if (time < EARLY_CUTOFF) {
    ev.text = "Early hydration. Smart move. +" + XP.drink + " XP";
  } else {
    ev.text = "Logged. Front-loading water earlier helps most. +" + XP.drink + " XP";
  }
  commit(ev);
}

function setNight(value) {
  var d = getDay(selected, true);
  if (d.night === value) return;     // already chosen; use Clear to remove
  var before = streaks();
  var firstAnswer = !d.night;
  d.night = value;

  if (value === "dry") {
    var after = streaks();
    var text;
    if (discreet) text = "Night logged. +" + (XP.night + XP.dry) + " XP";
    else if (after.cur > 1 && after.cur > before.best) text = "New personal best: " + after.cur + " nights 🏆";
    else if (after.cur > 1 && selected === today) text = after.cur + "-night streak 🔥 keep it going";
    else text = "Dry night logged. Solid.";
    commit({ text: text, sound: "log", big: !discreet && after.cur > 1 && after.cur > before.best });
  } else {
    var msg = discreet ? "Night logged." : "No stress, it happens. New night, fresh start.";
    commit({ text: msg + (firstAnswer ? " +" + XP.night + " XP" : ""), sound: "soft" });
  }
}

function clearNight() {
  var d = getDay(selected);
  if (!d.night) return;
  d.night = null;
  pruneDay(selected);
  override = null;
  sfx("remove");
  save();
  renderAll();
}

function deleteEntry(kind, index) {
  var d = getDay(selected);
  var list = kind === "wee" ? d.wees : d.drinks;
  var item = list.splice(index, 1)[0];
  if (item === undefined) return;
  var day = selected;
  pruneDay(day);
  override = null;
  sfx("remove");
  save();
  renderAll();

  var when = prettyTime(kind === "wee" ? item : item.t);
  showToast("Removed " + (kind === "wee" ? "pee" : "drink") + " at " + when, function () {
    var target = getDay(day, true);
    var arr = kind === "wee" ? target.wees : target.drinks;
    arr.push(item);
    if (kind === "wee") arr.sort(); else arr.sort(byTime);
    save();
    renderAll();
  });
}

function selectDay(k, opts) {
  opts = opts || {};
  if (!isValidKey(k) || k > today) return;
  selected = k;
  override = null;
  view = monthOf(k);
  calFocus = !!opts.focus;
  renderAll();
  if (opts.scroll && window.matchMedia("(max-width: 859px)").matches) {
    $("nightCard").scrollIntoView({ behavior: isReduced() ? "auto" : "smooth", block: "start" });
  }
}

function shiftMonth(n) {
  var target = new Date(view.y, view.m + n, 1);
  var nowM = monthOf(today);
  if (target.getFullYear() * 12 + target.getMonth() > nowM.y * 12 + nowM.m) return;
  view = { y: target.getFullYear(), m: target.getMonth() };
  renderCal();
  renderChart();
}

/* =========================================================
   Backup: export / import
   ========================================================= */
function exportData() {
  try {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "flow-backup-" + today + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    showToast("Backup saved.");
  } catch (e) {
    showToast("Sorry, the backup could not be saved.");
  }
}
function importData(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    var imported;
    try {
      var parsed = JSON.parse(String(reader.result));
      if (!parsed || typeof parsed !== "object" || Array.isArray(parsed) || !parsed.days) throw new Error("bad");
      imported = sanitize(parsed);
    } catch (e) {
      showToast("That file doesn't look like a Flow backup.");
      return;
    }
    if (!window.confirm("Replace the days in this tracker with the ones from the backup? Your achievements are always kept.")) return;
    Object.keys(imported.stickers).forEach(function (id) {
      if (!data.stickers[id]) data.stickers[id] = imported.stickers[id];
    });
    data.days = imported.days;
    awardStickers();
    save();
    override = null;
    renderAll();
    showToast("Backup loaded.");
  };
  reader.onerror = function () { showToast("Sorry, that file could not be read."); };
  reader.readAsText(file);
}

/* =========================================================
   Time keeping (single consistent "today")
   ========================================================= */
function refreshToday() {
  var t = todayKey();
  if (t === today) return;
  var old = today;
  today = t;
  if (selected === old) {
    var oldMonth = monthOf(old);
    var viewingOld = view.y === oldMonth.y && view.m === oldMonth.m;
    selected = t;
    if (viewingOld) view = monthOf(t);
  }
  override = null;
  renderAll();
}
function refreshClock() {
  refreshToday();
  renderTimes();
}

$("cal").addEventListener("keydown", function (e) {
  var b = e.target.closest("[data-date]");
  if (!b) return;
  var k = b.getAttribute("data-date");
  var next = null;
  var weekday = (parseKey(k).getDay() + 6) % 7;
  switch (e.key) {
    case "ArrowLeft": next = addDays(k, -1); break;
    case "ArrowRight": next = addDays(k, 1); break;
    case "ArrowUp": next = addDays(k, -7); break;
    case "ArrowDown": next = addDays(k, 7); break;
    case "Home": next = addDays(k, -weekday); break;
    case "End": next = addDays(k, 6 - weekday); break;
    case "PageUp":
    case "PageDown":
      var d = parseKey(k);
      var t = new Date(d.getFullYear(), d.getMonth() + (e.key === "PageUp" ? -1 : 1), 1);
      var last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
      t.setDate(Math.min(d.getDate(), last));
      next = keyOf(t);
      break;
    default: return;
  }
  e.preventDefault();
  if (next > today) next = today;
  selectDay(next, { focus: true });
});

    data = load(true);
    renderAll();
  } else if (e.key === MUTE_KEY) {
    muted = readFlag(MUTE_KEY, "0") === "1";
    renderTools();
  } else if (e.key === THEME_KEY) {
    theme = loadTheme();
    renderTools();
  } else if (e.key === DISCREET_KEY) {
    discreet = readFlag(DISCREET_KEY, "0") === "1";
    renderTools();
    renderAll();
  }
});
setInterval(refreshClock, 30000);

/* =========================================================
   Init
   ========================================================= */
(function init() {
  var before = JSON.stringify(data.stickers);
  awardStickers();                           // silently catch up on achievements
  if (JSON.stringify(data.stickers) !== before) save();
  renderTools();
  renderTimes();
  renderAll();
  if (loadNotice) {
    $("noticeText").textContent = loadNotice;
    $("notice").hidden = false;
  }
})();
})();
</script>
</body>
</html>
